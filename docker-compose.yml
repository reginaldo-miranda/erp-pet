version: '3.8'

services:
  erp-db:
    image: postgres:16-alpine
    container_name: erp-pet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_pet_db
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_P@ssw0rd_2026
    ports:
      - "5433:5432"
    volumes:
      - erp_pet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_pet_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  erp-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-pet-web
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ConnectionStrings__DefaultConnection=Host=erp-db;Port=5432;Database=erp_pet_db;Username=erp_user;Password=erp_P@ssw0rd_2026
    ports:
      - "5220:5000"
    volumes:
      - .:/app
      - erp_pet_nuget_cache:/root/.nuget/packages
    depends_on:
      erp-db:
        condition: service_healthy

volumes:
  erp_pet_postgres_data:
    driver: local
  erp_pet_nuget_cache:
    driver: local
